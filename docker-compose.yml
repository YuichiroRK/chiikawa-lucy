version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Esto asegura que la base de datos SQLite no se borre al reiniciar el contenedor
      - ./backend/database:/app/database 
    environment:
      - PORT=5000
      - NODE_ENV=production

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
